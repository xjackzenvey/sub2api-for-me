name: CialloAI Branch Image

on:
  push:
    branches:
      - ciallo
  workflow_dispatch:

concurrency:
  group: ciallo-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sub2api

jobs:
  build-and-push:
    # Keep this workflow limited to the ciallo branch, including manual runs.
    if: github.ref == 'refs/heads/ciallo'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout ciallo
        uses: actions/checkout@v6
        with:
          ref: ciallo

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=ciallo
            type=sha,prefix=ciallo-
          labels: |
            org.opencontainers.image.title=CialloAI
            org.opencontainers.image.description=CialloAI branch image built from the ciallo branch
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push branch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=ciallo-image
          cache-to: type=gha,mode=max,scope=ciallo-image
